name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: HyperModes-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(grep "versionName" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | sed 's/[^0-9]*//g')
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Create Release on Tag
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## HyperModes v${{ steps.version.outputs.name }}

          ### Changes
          - Zero-process architecture
          - System_server mode execution
          - Notification filtering
          - App suspension
          - Scheduled, Driving, and Bedtime triggers

          ### Installation
          1. Download `app-debug.apk`
          2. Install via ADB: `adb install -r app-debug.apk`
          3. Enable in LSPosed Manager (scope: System Framework)
          4. Reboot device

          ### Requirements
          - Android 13+ (API 33+)
          - LSPosed Framework
          - Root access
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
